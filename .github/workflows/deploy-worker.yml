name: CI (contact-form Worker)

on:
    push:
        branches:
            - master
        paths:
            - 'workers/contact-form/**'
            - '.github/workflows/deploy-worker.yml'
    pull_request:
        paths:
            - 'workers/contact-form/**'
            - '.github/workflows/deploy-worker.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run fmt:check

            - name: Validate Worker (dry run)
              if: github.event_name == 'pull_request'
              run: npx wrangler deploy --dry-run -c workers/contact-form/wrangler.toml

            - name: Deploy
              if: github.event_name != 'pull_request'
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy -c workers/contact-form/wrangler.toml
